# Credential scan (credential-scan v1).
# Canonical: Equilateral-AI/equilateral-common tools/credential-scan/credential-scan.yml
# Fails when any tracked file holds a credential or a machine-local config path is tracked.
# Output is path:line:class only; matched values are never printed.
name: credential-scan

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  credential-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for credentials
        run: bash scripts/credential-scan.sh --tracked
